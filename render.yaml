services:
  # -------------------------------------------------------------
  # QuantumFolio Unified Full-Stack Service (Next.js + Express + Socket.IO)
  # -------------------------------------------------------------
  - type: web
    name: quantumfolio
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
